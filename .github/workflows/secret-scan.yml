# GitHub에 올릴 때마다 비밀 정보가 들어 있는지 한 번 더 검사한다 (공개 저장소 무료).
# 전체 커밋 기록을 검사한다. 비밀 정보가 보이면 실패(빨간 X)로 표시된다.
name: secret-scan
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks 설치
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
      - name: 비밀 정보 검사 (전체 기록)
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
