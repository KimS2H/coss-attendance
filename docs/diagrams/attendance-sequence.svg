<text x="720" y="62" text-anchor="middle" font-size="12" fill="#64748B">모든 요청은 Tailscale Funnel → Nginx를 거쳐 API 서버에 도착 (그림에서는 생략) · 실선: 요청 · 점선: 응답</text>
