<rect x="20" y="164" width="1400" height="30" rx="6" fill="#0F1F4D"/>
<text x="36" y="184" font-size="14" font-weight="700" fill="#FFFFFF">① 강의실 코드 표시 (출석 시간 동안)</text>
<text x="400" y="250" font-size="12"  fill="#0F172A"  class="bg">A1. 강의실 코드 요청 (L-03 코드 화면)</text>
<line x1="1304" y1="256" x2="396" y2="256" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<polyline points="396,286 424,286 424,330 400,330" fill="none" stroke="#0F1F4D" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="434" y="298" font-size="12"  fill="#0F172A"  class="bg">A2. 코드 계산: 수업 ID + 30초 구간 + 서버 비밀 값</text>
<text x="456" y="313" font-size="12"  fill="#0F172A"  class="bg">(어디에도 저장하지 않음)</text>
<text x="400" y="352" font-size="12"  fill="#0F172A"  class="bg">A3. 코드 "4827" + 남은 시간 · 출석 인원</text>
<line x1="396" y1="358" x2="1304" y2="358" stroke="#2F5BD3" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar2)"/>
<rect x="60" y="400" width="390" height="28" rx="4" fill="#FEF9C3" stroke="#EAB308" stroke-width="1"/>
<text x="255" y="418" text-anchor="middle" font-size="12" fill="#713F12">학생은 강의실 화면(빔프로젝터)에 뜬 코드를 본다</text>
<rect x="20" y="460" width="1400" height="30" rx="6" fill="#0F1F4D"/>
<text x="36" y="480" font-size="14" font-weight="700" fill="#FFFFFF">② 학생 출석 체크</text>
<text x="130" y="512" font-size="12"  fill="#0F172A"  class="bg">B1. 오늘 수업 조회 (S-03 출석 메인)</text>
<line x1="126" y1="518" x2="384" y2="518" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="400" y="548" font-size="12"  fill="#0F172A"  class="bg">B2. 로그인 세션 확인 (3시간)</text>
<line x1="396" y1="554" x2="634" y2="554" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="400" y="584" font-size="12"  fill="#0F172A"  class="bg">B3. 오늘 수강 회차 · 출석 상태 조회</text>
<line x1="396" y1="590" x2="864" y2="590" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="130" y="620" font-size="12"  fill="#0F172A"  class="bg">B4. "1교시 | AI 기초" · 버튼 "미출"</text>
<line x1="384" y1="626" x2="126" y2="626" stroke="#2F5BD3" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar2)"/>
<polyline points="126,656 154,656 154,700 130,700" fill="none" stroke="#0F1F4D" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="164" y="668" font-size="12"  fill="#0F172A"  class="bg">B5. 출석 버튼 → 브라우저 위치 기능으로 좌표·정확도 얻기</text>
<text x="186" y="683" font-size="12"  fill="#0F172A"  class="bg">강의실 코드 4자리 입력 (S-04)</text>
<text x="130" y="722" font-size="12"  fill="#0F172A"  class="bg">B6. 출석 요청: 회차 · 좌표 · 정확도 · 코드</text><text x="130" y="737" font-size="12"  fill="#0F172A"  class="bg">(기기 쿠키 did는 브라우저가 자동으로 보냄)</text>
<line x1="126" y1="743" x2="384" y2="743" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="400" y="773" font-size="12"  fill="#0F172A"  class="bg">B7. 요청 횟수 확인 (학생당 1분 10회)</text>
<line x1="396" y1="779" x2="634" y2="779" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="400" y="809" font-size="12"  fill="#0F172A"  class="bg">B8. 수강 여부 · 회차 시간 · 장소 · 기존 출석 확인</text>
<line x1="396" y1="815" x2="864" y2="815" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<polyline points="396,845 424,845 424,919 400,919" fill="none" stroke="#0F1F4D" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="434" y="857" font-size="12"  fill="#0F172A"  class="bg">B9. 판정 ① 출석 가능 시간 (서버 시각)</text>
<text x="456" y="872" font-size="12"  fill="#0F172A"  class="bg">판정 ② 거리 − 정확도(최대 50m) ≤ 반경 50m</text>
<text x="456" y="887" font-size="12"  fill="#0F172A"  class="bg">판정 ③ 강의실 코드 (지금·직전 30초)</text>
<text x="456" y="902" font-size="12"  fill="#0F172A"  class="bg">(좌표는 거리 계산 후 버림)</text>
<text x="400" y="941" font-size="12"  fill="#0F172A"  class="bg">B10. 같은 수업 잠금: 동시에 온 출석을 하나씩 처리</text>
<line x1="396" y1="947" x2="864" y2="947" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="400" y="1011" font-size="12"  fill="#0F172A"  class="bg">B11. attendance_attempts 기록 (실패 사유)</text>
<line x1="396" y1="1017" x2="864" y2="1017" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="130" y="1047" font-size="12"  fill="#0F172A"  class="bg">B12. 실패 사유 · 다시 시도 · 문의 링크 (S-05)</text>
<line x1="384" y1="1053" x2="126" y2="1053" stroke="#2F5BD3" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar2)"/>
<text x="400" y="1113" font-size="12"  fill="#0F172A"  class="bg">B13. 기기 주인이면 상대 출석 취소, 아니면 내 출석 취소 · 불이익 기록</text>
<line x1="396" y1="1119" x2="864" y2="1119" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="400" y="1149" font-size="12"  fill="#0F172A"  class="bg">B14. 담당 인솔자 · 총관리자에게 대리 출석 알림</text>
<line x1="396" y1="1155" x2="1084" y2="1155" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="130" y="1185" font-size="12"  fill="#0F172A"  class="bg">B15. "출석" 또는 "출석 취소"</text>
<line x1="384" y1="1191" x2="126" y2="1191" stroke="#2F5BD3" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar2)"/>
<text x="400" y="1251" font-size="12"  fill="#0F172A"  class="bg">B16. attendances 저장: 출석/지각 · 판정 시각 = 요청 시각</text>
<line x1="396" y1="1257" x2="864" y2="1257" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="130" y="1287" font-size="12"  fill="#0F172A"  class="bg">B17. "출석" (또는 "지각") · 버튼 비활성화</text>
<line x1="384" y1="1293" x2="126" y2="1293" stroke="#2F5BD3" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar2)"/>
<text x="400" y="1353" font-size="12"  fill="#0F172A"  class="bg">B18. 기기(승인 대기) · 출석(승인 대기) · 승인 요청 저장</text>
<line x1="396" y1="1359" x2="864" y2="1359" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="400" y="1389" font-size="12"  fill="#0F172A"  class="bg">B19. 담당 인솔자에게 승인 요청 메일 + 화면 알림 기록</text>
<line x1="396" y1="1395" x2="1084" y2="1395" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="1100" y="1425" font-size="12"  fill="#0F172A"  class="bg">B20. 승인 요청 메일 도착</text>
<line x1="1096" y1="1431" x2="1304" y2="1431" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="130" y="1461" font-size="12"  fill="#0F172A"  class="bg">B21. "승인 대기 · 담당자 확인 중" + 대리 출석 경고</text>
<line x1="384" y1="1467" x2="126" y2="1467" stroke="#2F5BD3" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar2)"/>
<rect x="20" y="1527" width="1400" height="30" rx="6" fill="#0F1F4D"/>
<text x="36" y="1547" font-size="14" font-weight="700" fill="#FFFFFF">③ 미등록 기기 승인</text>
<text x="400" y="1579" font-size="12"  fill="#0F172A"  class="bg">C1. 기기 승인 요청 목록 열기 (L-08, 알림 배지)</text>
<line x1="1304" y1="1585" x2="396" y2="1585" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="400" y="1615" font-size="12"  fill="#0F172A"  class="bg">C2. 대기 중인 요청 · 다른 학생의 등록 기기인지 조회</text>
<line x1="396" y1="1621" x2="864" y2="1621" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="400" y="1651" font-size="12"  fill="#0F172A"  class="bg">C3. 요청 목록 (학생 · 요청 시각 · 기기 정보 · 거리 · 기기 주인)</text>
<line x1="396" y1="1657" x2="1304" y2="1657" stroke="#2F5BD3" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar2)"/>
<text x="400" y="1721" font-size="12"  fill="#0F172A"  class="bg">C4. 승인</text>
<line x1="1304" y1="1727" x2="396" y2="1727" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<polyline points="396,1757 424,1757 424,1816 400,1816" fill="none" stroke="#0F1F4D" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="434" y="1769" font-size="12"  fill="#0F172A"  class="bg">C5. 판정 시각 = 지금(승인 시각)</text>
<text x="456" y="1784" font-size="12"  fill="#0F172A"  class="bg">시작 5분 후까지 출석 · 종료 전 지각</text>
<text x="456" y="1799" font-size="12"  fill="#0F172A"  class="bg">종료 후면 결석</text>
<text x="400" y="1838" font-size="12"  fill="#0F172A"  class="bg">C6. 한 번에 저장: 출석 상태 · 새 기기 등록 · 이전 기기 해제 · 이력</text>
<line x1="396" y1="1844" x2="864" y2="1844" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="400" y="1874" font-size="12"  fill="#0F172A"  class="bg">C7. 처리 결과 안내</text>
<line x1="396" y1="1880" x2="1304" y2="1880" stroke="#2F5BD3" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar2)"/>
<text x="400" y="1940" font-size="12"  fill="#0F172A"  class="bg">C8. 거절 + 사유</text>
<line x1="1304" y1="1946" x2="396" y2="1946" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="400" y="1976" font-size="12"  fill="#0F172A"  class="bg">C9. 승인 요청 거절 · 기기 거절 · 출석은 결석 처리 · 이력</text>
<line x1="396" y1="1982" x2="864" y2="1982" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="130" y="2028" font-size="12"  fill="#0F172A"  class="bg">C10. 화면 새로고침 (30초마다 자동)</text>
<line x1="126" y1="2034" x2="384" y2="2034" stroke="#0F1F4D" stroke-width="1.5"  marker-end="url(#ar)"/>
<text x="130" y="2064" font-size="12"  fill="#0F172A"  class="bg">C11. "출석" / "지각" / "결석"</text>
<line x1="384" y1="2070" x2="126" y2="2070" stroke="#2F5BD3" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ar2)"/>
</svg>